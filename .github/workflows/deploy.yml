name: Test & Deploy
on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".railway/**"
      - .github/workflows/deploy.yml
      - .github/workflows/e2e.yml
      - .github/scripts/**
      - "src/**"
      - "e2e/**"

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_PROJECT_ID: 4a6f0233-9778-4f59-86e9-d82e40b63970
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: "Deploy preview + seed DB"
    runs-on: ubuntu-latest
    outputs:
      env-name: ${{ steps.create-env.outputs.env_name }}
      web-url: ${{ steps.deploy.outputs.web_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment production --service App

      - name: Create ephemeral environment (duplicate of production)
        id: create-env
        run: |
          ENV_NAME="ci-main"
          .github/scripts/create-preview-env.sh "$ENV_NAME" --recreate
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Seed ephemeral DB from production (scrubbed)
        run: .github/scripts/seed-env-db.sh "${{ steps.create-env.outputs.env_name }}"

      - name: Deploy web to ephemeral environment
        id: deploy
        run: |
          WEB_URL=$(.github/scripts/deploy-app.sh "${{ steps.create-env.outputs.env_name }}")
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"

  test:
    name: "Run E2E tests"
    needs: [preview]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      env-name: ${{ needs.preview.outputs.env-name }}
      web-url: ${{ needs.preview.outputs.web-url }}

  deploy-prod:
    name: "Deploy to Production"
    needs: [preview, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment production --service App
      - name: Deploy to production
        run: |
          railway up --service App --environment production --ci
          .github/scripts/wait-for-deploy.sh App production

  cleanup:
    name: "Clean Up"
    needs: [preview, test, deploy-prod]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.preview.outputs.env-name }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment production --service App
      - name: Delete ephemeral environment
        run: railway environment delete "${{ needs.preview.outputs.env-name }}" -y || true
