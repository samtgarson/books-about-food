<title>BAF Homepage Header</title>
<!--
  BOOKS ABOUT FOOD — HOMEPAGE HEADER (reference mockup)
  =====================================================
  A self-contained prototype of the new homepage header: the "Today's Specials" landing slide
  with a stack of featured books, then one 3D book per slide, auto-advancing.

  It is a reference for the real implementation, not production code. Read it alongside
  docs/homepage-header/README.md, which maps every part of this file onto the codebase
  (src/components/feature-carousel/*, the nav, the `features` collection).

  Layout of this file
    CSS   1. Design settings (every tuned value lives here)
          2. Base + mock chrome (preview frame only, not part of the site)
          3. Nav + progress line
          4. Carousel frame
          5. Slide positions (how books move)
          6. Landing stack
          7. 3D book
          8. Landing ("Today's Specials") slide
          9. Author credit
         10. Design commentary + "View Book"
         11. Phone arrows
         12. "Coming Soon" stub (context only)
         13. Tablet / desktop breakpoints
         14. Short screens + reduced motion
         15. Tuning panel (dev only, open with #tune)
    JS    A. Data  B. Building the DOM  C. Positions + render  D. Loop-around sequences
          E. Credit  F. Design commentary  G. Auto-advance  H. Input  I. Mock-only extras  J. Tuning panel

  Breakpoints match Tailwind in the app: sm 640, md 768, lg 1024. They are written as container
  queries on .site only so the Desktop/Mobile preview toggle can resize the page; in the app use
  normal Tailwind breakpoints. CSS is mobile-first.
-->
<style>
/* Graphik is inlined at build time from src/assets/fonts (the app loads it via next/font). */
@font-face { font-family: 'Graphik'; font-weight: 400; font-style: normal; src: url(data:font/otf;base64,__GRAPHIK_REGULAR__) format('opentype'); }
@font-face { font-family: 'Graphik'; font-weight: 500; font-style: normal; src: url(data:font/otf;base64,__GRAPHIK_MEDIUM__) format('opentype'); }

/* =============================================================================================
   1. DESIGN SETTINGS
   Every value the design was tuned with. Numbers are unitless so the dev tuning panel can drive
   them; units are added where they are used. Book dimensions are measured at desktop size and
   scale down with the book on smaller screens (see --k in section 7).
   In the app these become constants (or Tailwind theme values) next to the carousel component.
   ============================================================================================= */
:root {
  color-scheme: light;
  /* Brand colours, from src/style/globals.css */
  --black: #1d1d1b;
  --white: #fff;
  --grey: #f0eeeb;
  --primary-blue: #839dff;
  --sans: 'Graphik', ui-sans-serif, system-ui, sans-serif;
  /* Mock chrome only */
  --chrome-bg: #2b2b29;
  --chrome-fg: #f0eeeb;
  --chrome-muted: #9c9a95;
}

.site {
  /* Book shape */
  --size: .93;          /* book height as a fraction of the base height for the breakpoint (--hn) */
  --thick: 53;          /* total thickness, px at desktop size */
  --board: 3;           /* cover board thickness, px */
  --overhang: .5;       /* how far the covers stick out past the pages, px */
  --radius: 0;          /* fore-edge corner radius, px */

  /* Book pose (degrees; negative turns the spine towards you) */
  --turn: -16;          /* resting angle of the book in focus */
  --hover-turn: 6;      /* angle on hover (desktop) */
  --leave-turn: -25;    /* angle of books parked / leaving on the left */
  --arrive-turn: 30;    /* angle of books waiting / arriving on the right */
  --tilt: 0;            /* tilt back/forward */
  --persp: 1400;        /* perspective distance, px */
  --speed: 2;           /* hover turn duration, s */

  /* Motion + timing */
  --move: .6;           /* slide duration, s (books and their turn move together) */
  --auto: 6;            /* auto-advance after the book has settled, s */

  /* Shadow (cast by the back board) */
  --sh-o: .3; --sh-blur: 87; --sh-spread: 10; --sh-x: 0; --sh-y: 35;

  /* Surface */
  --crease: .08;        /* spine hinge shading on the front cover */
  --sheen: .02;         /* diagonal gloss across the front cover */
  --lines: .12;         /* contrast of the page lines on the page block */
  --page: #ffffff;      /* page block colour */

  /* Phone layout (< 640px) */
  --m-offset: 14;       /* nudge books down (+) / up (−) without changing the header height, px */
  --m-gap: 76;          /* space above and below the book; the header height follows from it, px */

  /* Desktop layout (≥ 1024px) */
  --d-height: 800;      /* max header height, px (it is also capped at 90% of the screen) */
  --d-offset: -15;      /* nudge books / stack / title down (+) or up (−), px */
  --d-credit: 40;       /* author row distance from the bottom, px */
  --d-stack-scale: 1.15;/* size of the books in the landing stack */
  --d-stack-span: 560;  /* width the stack spreads across from the right edge, px */
  --d-stack-tail: 150;  /* how much of the top stack book shows, px */
  --d-commentary-size: 26;   /* commentary font size, px */
  --d-commentary-width: 440; /* commentary max width, px */
}

/* =============================================================================================
   2. BASE + MOCK CHROME (the preview frame; not part of the site)
   ============================================================================================= */
* { box-sizing: border-box; }
html, body { background: var(--chrome-bg); color: var(--black); }
body { margin: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--primary-blue); outline-offset: 2px; }

.chrome {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 12px 16px; color: var(--chrome-fg); font-size: 13px;
}
.chrome__title { font-weight: 500; letter-spacing: .02em; }
.chrome__note { color: var(--chrome-muted); }
.chrome__toggle { display: inline-flex; border: 1px solid #55534f; border-radius: 999px; padding: 3px; margin-left: auto; }
.chrome__toggle button { padding: 6px 14px; border-radius: 999px; color: var(--chrome-muted); }
.chrome__toggle button[aria-pressed="true"] { background: var(--chrome-fg); color: var(--black); }

/* --frame-h stands in for the viewport height (100vh in the app) */
.stage { display: flex; justify-content: center; }
.stage[data-view="mobile"] { padding: 8px 16px 40px; }
.frame { --frame-h: calc(100vh - 56px); width: 100%; height: var(--frame-h); overflow-y: auto; overflow-x: hidden; background: var(--grey); }
.stage[data-view="mobile"] .frame {
  --frame-h: 760px; width: 390px; max-width: 100%;
  border-radius: 28px; border: 8px solid #111; box-shadow: 0 30px 60px rgba(0,0,0,.35);
  scrollbar-width: none;
}
.stage[data-view="mobile"] .frame::-webkit-scrollbar { display: none; }

.site { position: relative; container-type: inline-size; container-name: site; background: var(--grey); min-height: 100%; --gutter: 20px; }
.all-caps { font-size: 10px; line-height: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.icon { width: 24px; height: 24px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
.avatar {
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
  width: 24px; height: 24px; font-size: 9px; font-weight: 500; background: var(--a-bg); color: var(--a-fg);
}

/* =============================================================================================
   3. NAV + PROGRESS LINE   (src/components/nav/top-nav.tsx)
   The header is always dark now, so the nav is always white with no bottom border on the
   homepage (the old light/dark theme switching per slide is gone).
   ============================================================================================= */
.nav { position: absolute; inset: 0 0 auto 0; z-index: 60; }
.nav__bar {
  display: flex; align-items: center; gap: 16px; padding: 20px 16px 20px var(--gutter);
  color: var(--white); border-bottom: 1px solid transparent;
}
.nav__left { display: flex; align-items: center; gap: 32px; }
.nav__right { margin-left: auto; display: flex; align-items: center; gap: 16px; }

/* Auto-advance progress: a 2px hairline on the bottom edge of the nav bar, one segment per slide
   (landing + each book). Passed segments stay full, so it reads as one continuous line. */
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; display: flex; gap: 3px; pointer-events: none; }
.progress__seg { position: relative; flex: 1; overflow: hidden; background: rgba(255,255,255,.12); }
.progress__fill { position: absolute; inset: 0; background: rgba(255,255,255,.75); transform-origin: 0 50%; transform: scaleX(0); }

/* =============================================================================================
   4. CAROUSEL FRAME   (src/components/feature-carousel/index.tsx)
   --hn is the base book height for the breakpoint (320 phone / 380 tablet / 440 desktop / 200
   short screens); the real book height is --hn × --size.
   The track is the area books are vertically centred in: it starts under the nav (64px).
   ============================================================================================= */
.hero { position: relative; background: var(--black); }
.carousel {
  --hn: 320;
  position: relative; width: 100%; overflow-x: clip; overflow-y: hidden; background: var(--black);
  /* Phones: height is worked out from the book so the space above and below it matches:
     nav (64) + gap + book + gap + author row (56) */
  height: calc(64px + var(--m-gap) * 2px + var(--hn) * var(--size) * 1px + 56px);
}
.carousel[data-zone="next"] { cursor: e-resize; }
.carousel[data-zone="prev"] { cursor: w-resize; }
.track { position: absolute; left: 0; right: 0; top: calc(64px + var(--m-offset) * 1px); bottom: calc(56px - var(--m-offset) * 1px); }

/* =============================================================================================
   5. SLIDE POSITIONS
   Every slide (landing + books) is absolutely positioned at left: 0 and moved with `translate`
   so the compositor animates it without layout work. `cqw` = width of the carousel.
   Script sets data-pos on each slide; CSS turns that into a position. Positions:
     current            the slide in focus
     prev / next        peeking at the left / right edge (desktop + tablet)
     off-prev/off-next  waiting just outside the left / right edge
     stack-1…stack-5    the landing stack (section 6)
   Rules that keep motion clean (all enforced in script, section C/D):
     - books only ever enter from the edge they travel from, so nothing sweeps across the screen
     - z-index follows left-to-right order, so no book jumps in front of another mid-move
   ============================================================================================= */
.slide {
  position: absolute; top: 0; left: 0; height: 100%;
  display: flex;
  transition:
    translate calc(var(--move) * 1s) ease-in-out,
    scale calc(var(--move) * 1s) ease-in-out,
    opacity .4s ease-in-out,
    transform .3s ease-out;
}
.slide[data-pos="off-prev"] { z-index: 1;  translate: calc(-1 * var(--w, 100cqw) - 240px); pointer-events: none; }
.slide[data-pos="prev"]     { z-index: 5;  translate: -100%; cursor: w-resize; }
.slide[data-pos="current"]  { z-index: 10; translate: var(--gutter); }
.slide[data-pos="next"]     { z-index: 20; translate: 100cqw; cursor: e-resize; }
.slide[data-pos="off-next"] { z-index: 30; translate: calc(100cqw + 160px); pointer-events: none; }
/* Peeking books nudge towards the centre on hover (desktop) */
.slide[data-pos="next"]:hover { transform: translateX(-20px); }
.slide[data-pos="prev"]:hover { transform: translateX(20px); }

/* Book slides are exactly as wide as the book; the book in focus is centred */
.slide--feature { width: var(--w); align-items: center; justify-content: center; }
.slide--feature[data-pos="current"] { translate: calc(50cqw - var(--w) / 2); }
.slide--feature[data-pos="next"]    { translate: calc(100cqw + 40px); }   /* phones: fully off screen */
.slide--feature[data-pos="prev"]    { translate: calc(-1 * var(--w) - 40px); }

/* Helpers used by the script */
.slide.no-anim { transition: none !important; }                               /* reposition unseen */
.track[data-quick] .slide { transition-duration: calc(var(--move) * .5s); }    /* fast exit, see D */
.slide[data-pos^="off"][data-settled] { visibility: hidden; }                  /* stop painting off-screen books */

/* =============================================================================================
   6. LANDING STACK
   On the landing slide the first books fan out from the right edge, overlapping. Each shows its
   left (spine) side; the next book is the leftmost, the one on top is the rightmost. They are the
   same elements as the carousel slides, so "next" slides stack-1 straight into the centre.
   Phones show 3 (the rest wait off screen); tablet/desktop show up to 5.
   --stack-start = where stack-1 sits, --stack-tail = how much of the top book shows.
   ============================================================================================= */
.slide--feature[data-pos^="stack"] { cursor: pointer; transform-origin: 0 50%; scale: .9; }
.slide--feature {
  --stack-start: max(244px, calc(100cqw - 130px));
  --stack-tail: 50px;
  --stack-step: calc((100cqw - var(--stack-tail) - var(--stack-start)) / 2);   /* 3 books → 2 steps */
}
.slide--feature[data-pos="stack-1"] { z-index: 21; translate: var(--stack-start); }
.slide--feature[data-pos="stack-2"] { z-index: 22; translate: calc(var(--stack-start) + var(--stack-step)); }
.slide--feature[data-pos="stack-3"] { z-index: 23; translate: calc(var(--stack-start) + var(--stack-step) * 2); }
.slide--feature[data-pos="stack-4"] { z-index: 24; translate: calc(var(--stack-start) + var(--stack-step) * 3); }
.slide--feature[data-pos="stack-5"] { z-index: 25; translate: calc(var(--stack-start) + var(--stack-step) * 4); }

/* =============================================================================================
   7. 3D BOOK
   Built from flat faces in a preserve-3d box: front cover image, back board, spine, cover-board
   edges, and the page block (fore-edge + top + bottom), inset by the overhang.
   Width comes from the cover image's own ratio (--ratio = width / height), so any cover shape
   (portrait, square, landscape) produces a matching book.
   --back is the board/spine colour; in the app use book.backgroundColor (generated from the cover).
   ============================================================================================= */
.slide--feature {
  --k: calc(var(--hn) / 440 * var(--size));               /* scale factor vs desktop size */
  --h: calc(var(--hn) * var(--size) * 1px);               /* book height */
  --w: calc(var(--h) * var(--ratio));                     /* book width */
  --t: calc(var(--thick) * var(--k) * 1px);               /* thickness */
  --b: calc(var(--board) * var(--k) * 1px);               /* board */
  --ov: calc(var(--overhang) * var(--k) * 1px);           /* overhang */
  --pd: max(0px, calc(var(--t) - 2 * var(--b)));          /* page block depth */
}
.book3d-wrap { perspective: calc(var(--persp) * 1px); }
.book3d {
  position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d;
  transform: rotateX(calc(var(--tilt) * 1deg)) rotateY(calc(var(--turn) * -1deg));
  transition: transform calc(var(--move) * 1s) ease-in-out;   /* turns in step with the slide */
}
/* Pose follows position: parked/leaving on the left shows the spine, waiting on the right shows pages */
.slide[data-pos="prev"] .book3d, .slide[data-pos="off-prev"] .book3d { transform: rotateX(calc(var(--tilt) * 1deg)) rotateY(calc(var(--leave-turn) * -1deg)); }
.slide[data-pos="next"] .book3d, .slide[data-pos="off-next"] .book3d { transform: rotateX(calc(var(--tilt) * 1deg)) rotateY(calc(var(--arrive-turn) * -1deg)); }
.slide[data-pos="current"] .book3d:hover,
.site[data-pin-hover] .slide[data-pos="current"] .book3d {
  transform: rotateX(calc(var(--tilt) * 1deg)) rotateY(calc(var(--hover-turn) * -1deg));
  transition: transform calc(var(--speed) * 1s) cubic-bezier(.2, .7, .2, 1);
}

.book3d > * { position: absolute; display: block; margin: 0; pointer-events: none; }
.book3d img { max-width: none; }

/* Faces parallel to the cover, pushed forwards/backwards along z */
.b3-front, .b3-back, .b3-shade, .b3-sheen { left: 0; top: 0; width: var(--w); height: var(--h); }
.b3-front { object-fit: cover; transform: translateZ(calc(var(--t) / 2)); border-radius: 0 calc(var(--radius) * 1px) calc(var(--radius) * 1px) 0; }
.b3-back {
  transform: translateZ(calc(var(--t) / -2)); background: var(--back);
  border-radius: 0 calc(var(--radius) * 1px) calc(var(--radius) * 1px) 0;
  box-shadow: calc(var(--sh-x) * 1px) calc(var(--sh-y) * 1px) calc(var(--sh-blur) * 1px) calc(var(--sh-spread) * 1px) rgba(0, 0, 0, var(--sh-o));
}
.b3-shade {
  width: 3%; transform: translateZ(calc(var(--t) / 2 + .5px));
  background: linear-gradient(90deg, rgba(0,0,0,var(--crease)), rgba(255,255,255,calc(var(--crease) * .8)) 40%, rgba(0,0,0,0));
}
.b3-sheen {
  transform: translateZ(calc(var(--t) / 2 + .6px));
  background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,var(--sheen)) 48%, rgba(255,255,255,0) 62%);
}

/* Side faces hinge on their left edge and swing back along −z */
.b3-side { transform-origin: 0 50%; }
.b3-spine      { left: 0;        top: 0; width: var(--t); height: var(--h); background: var(--back); filter: brightness(.85); transform: translateZ(calc(var(--t) / 2)) rotateY(90deg); }
.b3-front-edge { left: var(--w); top: 0; width: var(--b); height: var(--h); background: var(--back); transform: translateZ(calc(var(--t) / 2)) rotateY(90deg); }
.b3-back-edge  { left: var(--w); top: 0; width: var(--b); height: var(--h); background: var(--back); transform: translateZ(calc(var(--t) / -2 + var(--b))) rotateY(90deg); }
.b3-pages-side {
  left: calc(var(--w) - var(--ov)); top: var(--ov); width: var(--pd); height: calc(var(--h) - 2 * var(--ov));
  transform: translateZ(calc(var(--t) / 2 - var(--b))) rotateY(90deg);
  background:
    linear-gradient(90deg, rgba(0,0,0,.06), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.08)),
    repeating-linear-gradient(90deg, var(--page) 0 1px, rgba(0,0,0,var(--lines)) 1px 2px, var(--page) 2px 3px),
    var(--page);
}

/* Top / bottom faces hinge on their top edge */
.b3-top { transform-origin: 50% 0; }
.b3-front-top, .b3-front-bottom { left: 0; width: var(--w); height: var(--b); background: var(--back); transform: translateZ(calc(var(--t) / 2)) rotateX(-90deg); }
.b3-back-top,  .b3-back-bottom  { left: 0; width: var(--w); height: var(--b); background: var(--back); transform: translateZ(calc(var(--t) / -2 + var(--b))) rotateX(-90deg); }
.b3-front-top, .b3-back-top { top: 0; }
.b3-front-bottom, .b3-back-bottom { top: var(--h); }
.b3-pages-top, .b3-pages-bottom {
  left: 0; width: calc(var(--w) - var(--ov)); height: var(--pd);
  transform: translateZ(calc(var(--t) / 2 - var(--b))) rotateX(-90deg);
  background: repeating-linear-gradient(0deg, var(--page) 0 1px, rgba(0,0,0,var(--lines)) 1px 2px, var(--page) 2px 3px), var(--page);
}
.b3-pages-top { top: var(--ov); }
.b3-pages-bottom { top: calc(var(--h) - var(--ov)); }

/* =============================================================================================
   8. LANDING SLIDE ("Today's Specials")   (src/components/feature-carousel/title.tsx)
   Full-width slide. Off-centre it fades to 10% and ignores taps (it would otherwise cover the
   whole carousel and swallow them).
   ============================================================================================= */
.slide--title { width: 100%; flex-direction: column; justify-content: center; padding-top: 35px; }
.slide--title:not([data-pos="current"]) { pointer-events: none; }
.title-copy { display: flex; flex-direction: column; gap: 16px; color: var(--white); pointer-events: none; transition: opacity .4s; }
.title-copy p { margin: 0; }
.title-copy h2 { margin: 0; font-size: 48px; line-height: 56px; font-weight: 400; max-width: 210px; }  /* phones: two lines */
.slide--title:not([data-pos="current"]) .title-copy { opacity: .1; }

/* =============================================================================================
   9. AUTHOR CREDIT   (bottom centre, for the book in focus)
   1 author: avatar + name. Several: up to 3 overlapping avatars (first on top) + first name + "+N".
   Full list goes in the hover title and aria-label. Hidden on the landing slide.
   ============================================================================================= */
.credit {
  position: absolute; left: 56px; right: 56px; bottom: 16px; min-height: 40px; z-index: 15;   /* phones: between the arrows */
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  color: var(--white); pointer-events: none;
  opacity: 0; translate: 0 6px; transition: opacity .25s ease-out, translate .25s ease-out;
}
.credit[data-show] { opacity: 1; translate: 0 0; }
.credit__person { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 22px; white-space: nowrap; }
.credit__faces { display: inline-flex; }
.credit__faces .avatar { position: relative; box-shadow: 0 0 0 2px var(--black); }
.credit__faces .avatar + .avatar { margin-left: -8px; }
.credit__more { opacity: .65; }

/* =============================================================================================
   10. DESIGN COMMENTARY + "VIEW BOOK"
   Centred over the book in focus. Appears once the book has settled and the carousel has been
   idle for 0.5s; the book fades to 18% behind it. Hidden again the moment anything moves.
   ============================================================================================= */
.commentary {
  position: absolute; left: 50%; top: 50%; z-index: 15; width: min(300px, calc(100% - 40px));
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  margin: 0; text-align: center; color: var(--white); pointer-events: none;
  opacity: 0; translate: -50% calc(-50% + 8px); transition: opacity .15s ease-out, translate .15s ease-out;
}
.commentary[data-show] { opacity: 1; translate: -50% -50%; transition-duration: .5s; }
.commentary__text {
  margin: 0; font-size: 18px; line-height: 26px; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;   /* max 5 lines */
}
.commentary__link { color: var(--white); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; padding: 6px 4px; }
.commentary__link:hover { text-decoration-thickness: 2px; }
.commentary[data-show] .commentary__link { pointer-events: auto; }
.slide[data-pos="current"] .book3d-wrap { transition: opacity .15s ease-out; }
.track[data-commentary] .slide[data-pos="current"] .book3d-wrap { opacity: .18; transition-duration: .5s; }

/* =============================================================================================
   11. PHONE ARROWS
   Either end of the author row. Offsets line the arrow strokes up with the menu and account
   icons above; the 2px drop is an optical correction so they look level with the name.
   ============================================================================================= */
.controls {
  position: absolute; left: 8px; right: 5px; bottom: 16px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  color: var(--white); pointer-events: none;
}
.controls button { pointer-events: auto; padding: 4px; }
.controls .chev { width: 32px; height: 32px; translate: 0 2px; }

/* =============================================================================================
   12. "COMING SOON" STUB — context only, so you can see where the header ends
   ============================================================================================= */
.below { border-top: 1px solid var(--black); padding: 64px var(--gutter) 40px; background: var(--grey); }
.below h2 { margin: 0; display: flex; align-items: center; justify-content: space-between; font-size: 28px; line-height: 38px; font-weight: 400; }
.btn-outline { display: none; border: 1px solid var(--black); border-radius: 999px; padding: 10px 20px; font-size: 14px; line-height: 22px; }
.below__strip { display: flex; gap: 24px; padding-top: 40px; overflow: hidden; }
.below__strip img { height: 180px; width: auto; max-width: none; }
.below__note { margin: 32px 0 0; font-size: 12px; color: #77756f; }

/* =============================================================================================
   13. BREAKPOINTS (tablet / desktop). Container queries stand in for Tailwind sm / md / lg.
   ============================================================================================= */
@container site (max-width: 639px) {
  /* Phones: only 3 books in the stack; the 4th and 5th wait off screen */
  .slide--feature[data-pos="stack-4"], .slide--feature[data-pos="stack-5"] { translate: calc(100cqw + 160px); }
}

/* sm — tablet */
@container site (min-width: 640px) {
  .all-caps { font-size: 12px; line-height: 18px; }
  .carousel { --hn: 380; height: calc(var(--frame-h) * .9); max-height: 800px; }   /* app: h-[90vh] max-h-200 */
  .track { top: 64px; bottom: 0; }
  .slide--title { padding-top: 0; }
  .title-copy { max-width: 340px; }
  .title-copy h2 { font-size: 64px; line-height: 77px; max-width: none; }
  .slide[data-pos="next"] { translate: calc(100cqw - 80px); }
  .slide--feature[data-pos="next"] { translate: calc(100cqw - 80px); }      /* peek 80px */
  .slide--feature[data-pos="prev"] { translate: calc(80px - var(--w)); }
  .slide--feature[data-pos^="stack"] { scale: 1; }
  .slide--feature {
    --stack-start: max(380px, calc(100cqw - 460px)); --stack-tail: 110px;
    --stack-step: calc((100cqw - var(--stack-tail) - var(--stack-start)) / 4);   /* 5 books → 4 steps */
  }
  .controls { display: none; }
  .credit { left: 20px; right: 20px; bottom: 40px; min-height: 0; }
  .credit__person { font-size: 16px; line-height: 24px; }
  .credit .avatar { width: 32px; height: 32px; font-size: 11px; }
  .commentary { width: min(440px, calc(100% - 40px)); gap: 20px; }
  .commentary__text { font-size: 26px; line-height: 34px; }
}

/* md */
@container site (min-width: 768px) {
  /* set on the children: a container query can't restyle its own container (.site) */
  .nav, .hero, .below { --gutter: 64px; }
}

/* lg — desktop: layout driven by the --d-* settings */
@container site (min-width: 1024px) {
  .carousel { --hn: 440; max-height: calc(var(--d-height) * 1px); }
  .track { top: calc(64px + var(--d-offset) * 1px); bottom: calc(var(--d-offset) * -1px); }
  .title-copy { max-width: none; }
  .slide--title[data-pos="prev"] { translate: -20px; }
  .slide--feature[data-pos^="stack"] { scale: var(--d-stack-scale); }
  .slide--feature {
    --stack-start: max(640px, calc(100cqw - var(--d-stack-span) * 1px));    /* never closer than 640px: keeps clear of the title */
    --stack-tail: calc(var(--d-stack-tail) * 1px);
  }
  .credit { bottom: calc(var(--d-credit) * 1px); }
  .commentary { width: min(calc(var(--d-commentary-width) * 1px), calc(100% - 40px)); }
  .commentary__text { font-size: calc(var(--d-commentary-size) * 1px); line-height: 1.3; }
  .below { padding: 80px 64px 48px; }
  .below h2 { font-size: 48px; line-height: 58px; }
  .btn-outline { display: inline-block; }
}

/* =============================================================================================
   14. SHORT SCREENS + REDUCED MOTION
   ============================================================================================= */
@media (max-height: 650px) {
  .carousel { --hn: 200; }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .book3d { transition: none !important; }
}

/* =============================================================================================
   15. TUNING PANEL — development only. Hidden unless the page is opened with #tune.
   Not part of the design; do not port.
   ============================================================================================= */
.tuner[hidden] { display: none; }
.tuner {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2000;
  width: 300px; max-width: calc(100vw - 32px); max-height: calc(100vh - 100px);
  display: flex; flex-direction: column;
  background: rgba(30,30,28,.94); color: var(--chrome-fg); border: 1px solid #4a4844; border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,.4); font-size: 12px;
}
.tuner__head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #3c3a37; }
.tuner__head strong { font-weight: 500; font-size: 13px; margin-right: auto; }
.tuner__btn { padding: 5px 10px; border-radius: 999px; border: 1px solid #55534f; color: var(--chrome-fg); font-size: 11px; }
.tuner__btn:hover { background: #3c3a37; }
.tuner__body { overflow-y: auto; padding: 4px 12px 12px; }
.tuner[data-collapsed] .tuner__body, .tuner[data-collapsed] .tuner__foot { display: none; }
.tuner h4 { margin: 14px 0 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--chrome-muted); font-weight: 500; }
.tuner__row { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 2px 8px; padding: 3px 0; }
.tuner__row label { color: #d6d3cd; }
.tuner__row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--chrome-muted); }
.tuner__row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--primary-blue); margin: 0; }
.tuner__row input[type="color"] { width: 52px; height: 22px; border: 0; padding: 0; background: none; }
.tuner__check { display: flex; align-items: center; gap: 8px; padding: 6px 0 0; color: #d6d3cd; }

<script>
(function () {
  // ===========================================================================================
  // A. DATA
  // Shaped like what the app has for each featured book (see README → Data):
  //   cover   book.cover (Image: src, width, height) — width/height give the 3D book its ratio
  //   back    book.backgroundColor (generated from the cover) — boards + spine
  //   designCommentary  book.designCommentary (existing field, edited in the CMS)
  //   href    book.href
  //   authors book.authors (Profile: name, avatar, backgroundColour, foregroundColour)
  // Placeholder content: covers supplied for the mockup, commentary written as examples.
  // ===========================================================================================
  const features = [
    { cover: { src: 'data:image/jpeg;base64,__COVER_1__', width: 800, height: 1178 }, back: '#7b1650', href: '#',
      designCommentary: 'Bold colour blocking that feels as layered as the spice blends inside.',
      authors: [{ name: 'Priya Mani', bg: '#d670a6', fg: '#1d1d1b' }] },
    { cover: { src: 'data:image/jpeg;base64,__COVER_2__', width: 800, height: 1127 }, back: '#1f74c4', href: '#',
      designCommentary: 'Woodcut-style illustration and a rolling-pin title make everyday cooking feel joyful.',
      authors: [{ name: 'Jeremy Lee', bg: '#fae068', fg: '#1d1d1b' }] },
    { cover: { src: 'data:image/jpeg;base64,__COVER_3__', width: 800, height: 1047 }, back: '#d7231f', href: '#',
      designCommentary: 'One plate, one colour, one big serif: a cover as quick and satisfying as the recipes.',
      authors: [{ name: 'Caroline Griffiths', bg: '#ed7656', fg: '#1d1d1b' }] },
    { cover: { src: 'data:image/jpeg;base64,__COVER_4__', width: 800, height: 1048 }, back: '#0f5a4f', href: '#',
      designCommentary: 'A single loaf in raking light. Calm, precise and quietly confident.',
      authors: [{ name: 'Satoshi Narusawa', bg: '#c7e171', fg: '#1d1d1b' }] },
    { cover: { src: 'data:image/jpeg;base64,__COVER_5__', width: 800, height: 1026 }, back: '#cfc7bb', href: '#',
      designCommentary: 'Copper foil and an art deco crust turn the humble pie into a centrepiece.',
      authors: [{ name: 'Calum Franklin', bg: '#ddd8d1', fg: '#1d1d1b' }] }
  ]

  // Slide 0 is the landing slide; slides 1…n-1 are books
  const slides = [{ isTitle: true }].concat(features.map(function (f) { return { feature: f } }))
  const n = slides.length
  const STACK_SIZE = 5              // books in the landing stack (phones show 3, set in CSS)
  const COMMENTARY_IDLE_MS = 500         // idle time after a book settles before its design commentary shows
  let current = 0
  let busy = false                  // true while a loop-around sequence (D) is running

  const site = document.getElementById('site')
  const carousel = document.getElementById('carousel')
  const track = document.getElementById('track')

  // Timing values live in CSS (section 1) so the dev panel can change them; read them here
  function cssSeconds(name, fallback) {
    const v = parseFloat(getComputedStyle(site).getPropertyValue(name))
    return (isNaN(v) ? fallback : v) * 1000
  }
  function moveMs() { return cssSeconds('--move', .6) }
  function autoMs() { return cssSeconds('--auto', 6) }

  // ===========================================================================================
  // B. BUILDING THE DOM
  // ===========================================================================================
  function initials(name) {
    return name.split(' ').map(function (p) { return p[0] }).slice(0, 2).join('')
  }

  // Stand-in for <Avatar>: initials on the profile colour (the app shows the photo)
  function avatar(person) {
    const el = document.createElement('span')
    el.className = 'avatar'
    el.style.setProperty('--a-bg', person.bg)
    el.style.setProperty('--a-fg', person.fg)
    el.textContent = initials(person.name)
    return el
  }

  function todayLabel() {
    const d = new Date()
    return d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + d.getDate() + ' ' +
      d.toLocaleDateString('en-GB', { month: 'short' })
  }

  // The 3D book: one element per face (see CSS section 7). Order matters only for readability;
  // depth sorting is done by the browser in 3D.
  function book3d(feature) {
    const wrap = document.createElement('div')
    wrap.className = 'book3d-wrap'
    const book = document.createElement('div')
    book.className = 'book3d'
    book.style.setProperty('--back', feature.back)
    book.innerHTML =
      '<div class="b3-back"></div>' +
      '<div class="b3-side b3-back-edge"></div><div class="b3-top b3-back-top"></div><div class="b3-top b3-back-bottom"></div>' +
      '<div class="b3-side b3-pages-side"></div><div class="b3-top b3-pages-top"></div><div class="b3-top b3-pages-bottom"></div>' +
      '<div class="b3-side b3-spine"></div>' +
      '<div class="b3-side b3-front-edge"></div><div class="b3-top b3-front-top"></div><div class="b3-top b3-front-bottom"></div>' +
      '<img class="b3-front" alt=""><div class="b3-shade"></div><div class="b3-sheen"></div>'
    const img = book.querySelector('img')
    img.decoding = 'async'
    img.src = feature.cover.src
    wrap.appendChild(book)
    return wrap
  }

  function buildSlide(slide) {
    const el = document.createElement('a')
    el.href = '#'
    if (slide.isTitle) {
      el.className = 'slide slide--title'
      el.innerHTML = '<div class="title-copy"><p class="all-caps"></p><h2>Today’s Specials</h2></div>'
      el.querySelector('p').textContent = todayLabel()
      return el
    }
    const f = slide.feature
    el.className = 'slide slide--feature'
    el.setAttribute('aria-label', 'Cookbook by ' + f.authors.map(function (a) { return a.name }).join(', '))
    // Book width follows the cover's own proportions
    el.style.setProperty('--ratio', (f.cover.width / f.cover.height).toFixed(4))
    el.appendChild(book3d(f))
    return el
  }

  const slideEls = slides.map(buildSlide)
  slideEls.forEach(function (el) {
    track.appendChild(el)
    // Mark a slide "settled" when it finishes moving, so off-screen ones stop being painted
    el.addEventListener('transitionend', function (e) {
      if (e.target === el && e.propertyName === 'translate') el.setAttribute('data-settled', '')
    })
    // Peeking books and the stack are clickable; the book in focus is left to its link
    el.addEventListener('click', function (e) {
      e.preventDefault()
      const pos = el.dataset.pos
      if (pos === 'next' || pos.indexOf('stack-') === 0) go(current + 1)   // any stack book opens the first
      else if (pos === 'prev') go(current - 1)
      else return
      e.stopPropagation()
    })
  })

  // ===========================================================================================
  // C. POSITIONS + RENDER
  // `d` = how many places after the current slide a slide is (wrapping round).
  // ===========================================================================================
  function side(pos) {
    if (pos === 'prev' || pos === 'off-prev') return 'left'
    if (pos === 'next' || pos === 'off-next' || (pos && pos.indexOf('stack-') === 0)) return 'right'
    return 'centre'
  }
  function isOff(pos) { return !!pos && pos.indexOf('off') === 0 }
  function isRightVisible(pos) { return pos === 'next' || (!!pos && pos.indexOf('stack-') === 0) }

  function positionFor(d, was) {
    if (d === 0) return 'current'
    if (slides[current].isTitle) return d <= STACK_SIZE ? 'stack-' + d : 'off-next'
    if (d === 1) return 'next'
    if (d === n - 1) return 'prev'
    // Off-screen books wait on the side they left by, so nothing sweeps across the screen
    if (side(was) === 'right') return 'off-next'
    if (side(was) === 'left') return 'off-prev'
    return d <= n / 2 ? 'off-next' : 'off-prev'
  }

  // All position changes go through here so the "settled" flag is never stale
  function setPos(el, pos) {
    if (el.dataset.pos !== pos) el.removeAttribute('data-settled')
    el.dataset.pos = pos
  }

  // Move slides without animating (used to reposition books that are off screen)
  function placeInstantly(els, pos) {
    els.forEach(function (el) { el.classList.add('no-anim'); setPos(el, pos) })
    void track.offsetWidth
    els.forEach(function (el) { el.classList.remove('no-anim') })
    void track.offsetWidth
  }

  // dir: 1 forward, -1 back. Rule: a book only enters from the edge it travels from and only
  // leaves by the edge it is nearest. Books that need to come in from the other side are first
  // placed (unseen) just outside that edge, then animated in.
  function render(dir) {
    dir = dir || 1
    const plan = slideEls.map(function (el, i) {
      const d = ((i - current) % n + n) % n
      const was = el.dataset.pos
      let pos = positionFor(d, was)
      let stage = null
      // A visible book can't jump to the other side: let it leave by its own edge instead
      if (isRightVisible(was) && pos === 'prev') pos = 'off-next'
      if (was === 'prev' && isRightVisible(pos)) pos = 'off-prev'
      if (isOff(was)) {
        if (isOff(pos)) {
          if (pos !== was) stage = pos                       // waiting on the wrong side
        } else {
          const entry = isRightVisible(pos) ? 'off-next'
            : pos === 'prev' ? 'off-prev'
            : (dir > 0 ? 'off-next' : 'off-prev')
          if (entry !== was) stage = entry
        }
      }
      return { el: el, pos: pos, stage: stage }
    })

    plan.filter(function (p) { return p.stage }).forEach(function (p) { placeInstantly([p.el], p.stage) })

    plan.forEach(function (p) {
      setPos(p.el, p.pos)
      const hidden = isOff(p.pos)
      p.el.setAttribute('aria-hidden', hidden ? 'true' : 'false')
      p.el.tabIndex = hidden ? -1 : 0
      p.el.title = p.pos === 'next' ? 'Next' : p.pos === 'prev' ? 'Previous' : ''
    })
    afterMove()
  }

  // Everything that follows the slide in focus
  function afterMove() {
    updateCredit()
    scheduleCommentary()
    startTimer()
  }

  // ===========================================================================================
  // D. LOOP-AROUND SEQUENCES + NAVIGATION
  // Two moves need choreography so books never fly across the screen:
  //   forward into the landing slide  — books on screen leave left; once off screen they are moved
  //                                     to the right edge unseen and slide back in as the stack
  //   backward out of the landing slide — the stack slips quickly off to the right; once off screen
  //                                     the books are lined up off the left edge and the last book
  //                                     slides in from the left
  // Each waits for the books to actually be off screen (not a timer), so a slow frame can't
  // cause a visible jump.
  // ===========================================================================================
  function whenBooksOffscreen(cb) {
    const started = performance.now()
    function check() {
      const box = carousel.getBoundingClientRect()
      const allOff = slideEls.every(function (el, i) {
        if (slides[i].isTitle) return true
        const r = el.querySelector('.book3d').getBoundingClientRect()
        return r.right <= box.left || r.left >= box.right
      })
      if (allOff || performance.now() - started > 2500) cb()
      else requestAnimationFrame(check)
    }
    requestAnimationFrame(check)
  }

  const bookEls = slideEls.filter(function (_, i) { return !slides[i].isTitle })

  function go(i) {
    if (busy) return
    stopTimer()
    const target = ((i % n) + n) % n

    // Forward into the landing slide (from anywhere but the first book)
    if (slides[target].isTitle && current !== target && current !== 1) {
      busy = true
      current = target
      updateCredit()
      scheduleCommentary()
      slideEls.forEach(function (el, idx) {
        if (slides[idx].isTitle) setPos(el, 'current')
        else if (side(el.dataset.pos) === 'right') setPos(el, 'off-next')   // already right: stay there
        else setPos(el, 'off-prev')                                           // on screen: leave left
      })
      whenBooksOffscreen(function () {
        placeInstantly(bookEls, 'off-next')
        render(1)
        setTimeout(function () { busy = false }, moveMs())
      })
      return
    }

    // Backward out of the landing slide (to the last book)
    if (slides[current].isTitle && target === n - 1) {
      busy = true
      track.setAttribute('data-quick', '')
      bookEls.forEach(function (el) { setPos(el, 'off-next') })
      whenBooksOffscreen(function () {
        track.removeAttribute('data-quick')
        placeInstantly(bookEls, 'off-prev')
        current = target
        render(-1)
        setTimeout(function () { busy = false }, moveMs())
      })
      return
    }

    const forward = target === (current + 1) % n || (target > current && target !== (current + n - 1) % n)
    current = target
    render(forward ? 1 : -1)
  }

  // ===========================================================================================
  // E. AUTHOR CREDIT
  // ===========================================================================================
  const credit = document.getElementById('credit')
  let creditFor = null
  let creditTimer = null
  let previewCoAuthors = false   // dev panel only (J)

  function updateCredit(force) {
    const slide = slides[current]
    if (creditFor === current && !force) return
    creditFor = current
    credit.removeAttribute('data-show')
    clearTimeout(creditTimer)
    if (!slide.feature) return
    // Fade out, swap, fade in (no delay the very first time)
    creditTimer = setTimeout(function () {
      const authors = creditAuthors(slide.feature)
      const names = authors.map(function (a) { return a.name })
      const person = document.createElement('span')
      person.className = 'credit__person'
      person.title = names.join(', ')
      const faces = document.createElement('span')
      faces.className = 'credit__faces'
      authors.slice(0, 3).forEach(function (a, i) {
        const face = avatar(a)
        face.style.zIndex = 3 - i        // first author on top
        faces.appendChild(face)
      })
      person.appendChild(faces)
      person.appendChild(document.createTextNode(authors[0].name))
      if (authors.length > 1) {
        const more = document.createElement('span')
        more.className = 'credit__more'
        more.textContent = '+' + (authors.length - 1)
        person.appendChild(more)
      }
      credit.textContent = ''
      credit.setAttribute('aria-label', 'By ' + names.join(', '))
      credit.appendChild(person)
      credit.setAttribute('data-show', '')
    }, credit.textContent ? 250 : 0)
  }

  // ===========================================================================================
  // F. DESIGN COMMENTARY
  // ===========================================================================================
  const commentary = document.getElementById('commentary')
  const commentaryText = document.getElementById('commentary-text')
  const commentaryLink = document.getElementById('commentary-link')
  let commentaryTimer = null

  // Mockup only: in the app this is a <Link> to the book's page
  commentaryLink.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation() })

  function scheduleCommentary() {
    clearTimeout(commentaryTimer)
    commentary.removeAttribute('data-show')
    track.removeAttribute('data-commentary')
    commentaryLink.tabIndex = -1
    const f = slides[current].feature
    if (!f || !f.designCommentary) return
    commentaryTimer = setTimeout(function () {
      commentaryText.textContent = f.designCommentary
      commentaryLink.href = f.href
      commentaryLink.setAttribute('aria-label', 'View book by ' + f.authors.map(function (a) { return a.name }).join(', '))
      commentaryLink.tabIndex = 0
      commentary.setAttribute('data-show', '')
      track.setAttribute('data-commentary', '')
    }, moveMs() + COMMENTARY_IDLE_MS)
  }

  // ===========================================================================================
  // G. AUTO-ADVANCE + PROGRESS LINE
  // Each slide's segment fills over --auto seconds, starting once the slide has arrived (delay =
  // slide duration), then the carousel moves on. Manual navigation restarts it on the new slide
  // and it keeps running afterwards. Pauses while the tab is hidden. Off with reduced motion.
  // The fill is a Web Animation on transform, so it runs on the compositor.
  // ===========================================================================================
  const progressFills = slides.map(function () {
    const seg = document.createElement('div')
    seg.className = 'progress__seg'
    const fill = document.createElement('div')
    fill.className = 'progress__fill'
    seg.appendChild(fill)
    document.getElementById('progress').appendChild(seg)
    return fill
  })
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)')
  let progress = null

  function stopTimer() {
    if (progress) progress.cancel()
    progress = null
  }

  function syncPause() {
    if (!progress) return
    if (document.hidden) progress.pause()
    else progress.play()
  }

  function startTimer() {
    stopTimer()
    progressFills.forEach(function (fill, i) { fill.style.transform = i < current ? 'scaleX(1)' : 'scaleX(0)' })
    if (reduceMotion.matches) {
      progressFills[current].style.transform = 'scaleX(1)'
      return
    }
    progress = progressFills[current].animate(
      [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
      { duration: autoMs(), delay: moveMs(), easing: 'linear', fill: 'both' }
    )
    progress.onfinish = function () {
      progressFills[current].style.transform = 'scaleX(1)'
      go(current + 1)
    }
    syncPause()
  }

  document.addEventListener('visibilitychange', syncPause)

  // ===========================================================================================
  // H. INPUT
  //   tap/click right half → next, left half → previous (the book in focus and links excluded)
  //   swipe left/right, arrow keys, phone arrow buttons
  // ===========================================================================================
  function zoneFor(e) {
    if (e.target.closest('.controls, .commentary__link')) return null
    if (e.target.closest('.slide[data-pos="current"] .book3d')) return null
    const rect = carousel.getBoundingClientRect()
    return e.clientX - rect.left > rect.width / 2 ? 'next' : 'prev'
  }
  carousel.addEventListener('click', function (e) {
    const zone = zoneFor(e)
    if (zone === 'next') go(current + 1)
    if (zone === 'prev') go(current - 1)
  })
  carousel.addEventListener('mousemove', function (e) {
    const zone = zoneFor(e) || ''
    if (carousel.dataset.zone !== zone) carousel.dataset.zone = zone   // only touch the DOM on change
  })

  let touch = null
  carousel.addEventListener('touchstart', function (e) { touch = [e.touches[0].clientX, e.touches[0].clientY] }, { passive: true })
  carousel.addEventListener('touchend', function (e) {
    if (!touch) return
    const t = e.changedTouches[0]
    const dx = touch[0] - t.clientX
    if (Math.abs(touch[1] - t.clientY) < 40 && Math.abs(dx) > 50) go(current + (dx > 0 ? 1 : -1))
    touch = null
  })

  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input, textarea')) return
    if (e.key === 'ArrowRight') go(current + 1)
    if (e.key === 'ArrowLeft') go(current - 1)
  })

  carousel.querySelector('.prev-btn').addEventListener('click', function () { go(current - 1) })
  carousel.querySelector('.next-btn').addEventListener('click', function () { go(current + 1) })

  // ===========================================================================================
  // I. MOCK-ONLY EXTRAS (not part of the design)
  // ===========================================================================================
  // Covers under "Coming Soon", for context
  const strip = document.getElementById('below-strip')
  features.concat(features).forEach(function (f) {
    const img = document.createElement('img')
    img.src = f.cover.src
    img.alt = ''
    strip.appendChild(img)
  })

  // Desktop / Mobile preview toggle
  const stage = document.getElementById('stage')
  function setView(view) {
    stage.dataset.view = view
    document.querySelectorAll('.chrome__toggle button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.view === view ? 'true' : 'false')
    })
    try { localStorage.setItem('baf-mock-view', view) } catch (err) {}
  }
  document.querySelectorAll('.chrome__toggle button').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.dataset.view) })
  })
  try { const saved = localStorage.getItem('baf-mock-view'); if (saved) setView(saved) } catch (err) {}

  // ===========================================================================================
  // J. TUNING PANEL — development only. Open the page with #tune to show it.
  // Each slider drives one CSS variable from section 1. "Copy values" copies them as text.
  // ===========================================================================================
  const SETTINGS = [
    { group: 'Shape' },
    { key: 'size', label: 'Book size', min: .5, max: 1.5, step: .01, def: .93, fmt: function (v) { return Math.round(v * 100) + '%' } },
    { key: 'thick', label: 'Book thickness', min: 6, max: 100, step: 1, def: 53, unit: 'px' },
    { key: 'board', label: 'Cover board thickness', min: 0, max: 12, step: .5, def: 3, unit: 'px' },
    { key: 'overhang', label: 'Cover overhang', min: 0, max: 16, step: .5, def: .5, unit: 'px' },
    { key: 'radius', label: 'Cover corner radius', min: 0, max: 12, step: .5, def: 0, unit: 'px' },
    { group: 'Pose' },
    { key: 'turn', label: 'Resting turn (negative shows spine)', min: -60, max: 60, step: 1, def: -16, unit: '°' },
    { key: 'hoverTurn', css: 'hover-turn', label: 'Turn on hover', min: -60, max: 60, step: 1, def: 6, unit: '°' },
    { key: 'tilt', label: 'Tilt back / forward', min: -25, max: 25, step: 1, def: 0, unit: '°' },
    { key: 'persp', label: 'Perspective depth', min: 300, max: 4000, step: 50, def: 1400, unit: 'px' },
    { key: 'speed', label: 'Hover turn speed', min: .1, max: 2, step: .05, def: 2, unit: 's' },
    { group: 'Moving between books' },
    { key: 'leaveTurn', css: 'leave-turn', label: 'Turn while leaving (negative shows spine)', min: -70, max: 60, step: 1, def: -25, unit: '°' },
    { key: 'arriveTurn', css: 'arrive-turn', label: 'Turn while arriving', min: -60, max: 60, step: 1, def: 30, unit: '°' },
    { key: 'move', label: 'Slide speed', min: .2, max: 2, step: .05, def: .6, unit: 's' },
    { key: 'auto', label: 'Auto-advance after', min: 1, max: 15, step: .5, def: 6, unit: 's' },
    { group: 'Shadow' },
    { key: 'shO', css: 'sh-o', label: 'Shadow strength', min: 0, max: .7, step: .01, def: .3 },
    { key: 'shBlur', css: 'sh-blur', label: 'Shadow softness', min: 0, max: 150, step: 1, def: 87, unit: 'px' },
    { key: 'shSpread', css: 'sh-spread', label: 'Shadow spread', min: -30, max: 40, step: 1, def: 10, unit: 'px' },
    { key: 'shX', css: 'sh-x', label: 'Shadow offset X', min: -80, max: 80, step: 1, def: 0, unit: 'px' },
    { key: 'shY', css: 'sh-y', label: 'Shadow offset Y', min: -40, max: 80, step: 1, def: 35, unit: 'px' },
    { group: 'Mobile layout' },
    { key: 'mOffset', css: 'm-offset', label: 'Book vertical position (+ is lower)', min: -40, max: 40, step: 1, def: 14, unit: 'px' },
    { key: 'mGap', css: 'm-gap', label: 'Space around book', min: 16, max: 120, step: 1, def: 76, unit: 'px' },
    { group: 'Desktop layout' },
    { key: 'dHeight', css: 'd-height', label: 'Header height (max)', min: 480, max: 1000, step: 10, def: 800, unit: 'px' },
    { key: 'dOffset', css: 'd-offset', label: 'Book vertical position (+ is lower)', min: -80, max: 80, step: 1, def: -15, unit: 'px' },
    { key: 'dCredit', css: 'd-credit', label: 'Author distance from bottom', min: 8, max: 120, step: 1, def: 40, unit: 'px' },
    { key: 'dStackScale', css: 'd-stack-scale', label: 'Stack: book size', min: .7, max: 1.5, step: .01, def: 1.15, fmt: function (v) { return Math.round(v * 100) + '%' } },
    { key: 'dStackSpan', css: 'd-stack-span', label: 'Stack: width it spreads across', min: 200, max: 900, step: 10, def: 560, unit: 'px' },
    { key: 'dStackTail', css: 'd-stack-tail', label: 'Stack: top book showing', min: 40, max: 400, step: 5, def: 150, unit: 'px' },
    { key: 'dCommentarySize', css: 'd-commentary-size', label: 'Design commentary text size', min: 16, max: 40, step: 1, def: 26, unit: 'px' },
    { key: 'dCommentaryWidth', css: 'd-commentary-width', label: 'Design commentary width', min: 240, max: 720, step: 10, def: 440, unit: 'px' },
    { group: 'Surface' },
    { key: 'crease', label: 'Spine crease', min: 0, max: .4, step: .01, def: .08 },
    { key: 'sheen', label: 'Cover sheen', min: 0, max: .6, step: .01, def: .02 },
    { key: 'lines', label: 'Page line contrast', min: 0, max: .3, step: .01, def: .12 },
    { key: 'page', label: 'Page colour', type: 'color', def: '#ffffff' }
  ]
  const PLACEHOLDER_COAUTHORS = [
    { name: 'Co-author Two', bg: '#c3d6ff', fg: '#1d1d1b' },
    { name: 'Co-author Three', bg: '#eaca36', fg: '#1d1d1b' },
    { name: 'Co-author Four', bg: '#c7e171', fg: '#1d1d1b' }
  ]

  // Authors shown in the credit; the panel can add placeholder co-authors (1–3 per book) to preview
  function creditAuthors(feature) {
    if (!previewCoAuthors) return feature.authors
    const extra = (features.indexOf(feature) + 1) % 3 + 1
    return feature.authors.concat(PLACEHOLDER_COAUTHORS.slice(0, extra))
  }

  function initTuningPanel() {
    const STORE = 'baf-book3d-settings-v11'
    const tuner = document.getElementById('tuner')
    const body = document.getElementById('tuner-body')
    const status = document.getElementById('tuner-status')
    let values = {}
    try { values = JSON.parse(localStorage.getItem(STORE) || '{}') } catch (err) { values = {} }
    tuner.hidden = false

    function cssName(s) { return '--' + (s.css || s.key) }
    function display(s, v) { return s.fmt ? s.fmt(v) : s.type === 'color' ? v : (+v) + (s.unit || '') }
    function valueOf(s) { return values[s.key] !== undefined ? values[s.key] : s.def }
    function apply(s, v) {
      site.style.setProperty(cssName(s), v)
      const out = document.getElementById('out-' + s.key)
      if (out) out.textContent = display(s, v)
    }
    function save() { try { localStorage.setItem(STORE, JSON.stringify(values)) } catch (err) {} }

    SETTINGS.forEach(function (s) {
      if (s.group) {
        const h = document.createElement('h4')
        h.textContent = s.group
        body.appendChild(h)
        return
      }
      const row = document.createElement('div')
      row.className = 'tuner__row'
      const id = 'set-' + s.key
      row.innerHTML = s.type === 'color'
        ? '<label for="' + id + '"></label><input type="color" id="' + id + '">'
        : '<label for="' + id + '"></label><output id="out-' + s.key + '"></output><input type="range" id="' + id + '">'
      row.querySelector('label').textContent = s.label
      const input = row.querySelector('input')
      if (s.type !== 'color') { input.min = s.min; input.max = s.max; input.step = s.step }
      input.value = valueOf(s)
      input.addEventListener('input', function () {
        values[s.key] = s.type === 'color' ? input.value : +input.value
        apply(s, values[s.key])
        save()
      })
      body.appendChild(row)
      apply(s, valueOf(s))
    })

    function checkbox(id, label, onChange) {
      const el = document.createElement('label')
      el.className = 'tuner__check'
      el.innerHTML = '<input type="checkbox" id="' + id + '"> ' + label
      el.querySelector('input').addEventListener('change', function (e) { onChange(e.target.checked) })
      body.appendChild(el)
    }
    checkbox('set-pin-hover', 'Hold the hover pose (preview without hovering)', function (on) {
      site.toggleAttribute('data-pin-hover', on)
    })
    checkbox('set-coauthors', 'Preview with extra authors (placeholder names)', function (on) {
      previewCoAuthors = on
      updateCredit(true)
    })

    document.getElementById('tuner-reset').addEventListener('click', function () {
      values = {}
      save()
      SETTINGS.forEach(function (s) {
        if (s.group) return
        document.getElementById('set-' + s.key).value = s.def
        apply(s, s.def)
      })
      status.textContent = 'Back to the defaults.'
    })

    document.getElementById('tuner-copy').addEventListener('click', function () {
      const text = SETTINGS.filter(function (s) { return !s.group })
        .map(function (s) { return s.label + ': ' + display(s, valueOf(s)) }).join('\n')
      function fallback() {
        status.textContent = 'Copy blocked here. Select the text below and copy it.'
        let box = document.getElementById('tuner-copy-text')
        if (!box) {
          box = document.createElement('textarea')
          box.id = 'tuner-copy-text'
          box.rows = 6
          box.style.cssText = 'width:100%;margin-top:8px;font:11px ui-monospace,monospace;background:#1d1d1b;color:#f0eeeb;border:1px solid #4a4844;border-radius:6px;padding:6px'
          body.appendChild(box)
        }
        box.value = text
        box.select()
      }
      try {
        navigator.clipboard.writeText(text).then(function () {
          status.textContent = 'Copied. Paste them into the chat to lock this look in.'
        }, fallback)
      } catch (err) { fallback() }
    })

    const toggle = document.getElementById('tuner-toggle')
    function setCollapsed(collapsed) {
      tuner.toggleAttribute('data-collapsed', collapsed)
      toggle.textContent = collapsed ? 'Show' : 'Hide'
      toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
    }
    setCollapsed(window.innerWidth < 700)
    toggle.addEventListener('click', function () { setCollapsed(!tuner.hasAttribute('data-collapsed')) })
  }

  if (location.hash === '#tune') initTuningPanel()

  // ===========================================================================================
  // START — first paint puts everything in place without animating in from the left edge
  // ===========================================================================================
  slideEls.forEach(function (el) { el.classList.add('no-anim') })
  render(1)
  void track.offsetWidth
  slideEls.forEach(function (el) { el.classList.remove('no-anim') })
})()
</script>
